site_name: markwright
site_description: Python-Markdown extensions ported from DigitalOcean's do-markdownit
repo_url: https://github.com/MasonEgger/markwright
repo_name: MasonEgger/markwright

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true
  - markwright.highlight
  - markwright.fence:
      allowed_environments:
        - local
        - second
        - third
        - fourth
        - fifth
  - markwright.youtube
  - markwright.codepen
  - markwright.twitter
  - markwright.instagram
  - markwright.slideshow
  - markwright.image_compare
  - markwright.button
  - markwright.lightbox
  - markwright.mermaid
  - markwright.grid
  - markwright.annotate
  - markwright.icons:
      packs:
        lucide: docs/icons/lucide
        mw: docs/icons/mw

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: javascripts/mermaid.js
    type: module
  - javascripts/lightbox.js
  - javascripts/annotate.js

nav:
  - Home: index.md
  - Configuration: config.md
  - Click-to-Load: click-to-load.md
  - CLI:
      - Reference: cli.md
      - Pipeline Guide: pipeline.md
      - Renderer Requirements: renderer-requirements.md
  - Extensions:
      - Highlight: extensions/highlight.md
      - Fence: extensions/fence.md
      - YouTube: extensions/youtube.md
      - CodePen: extensions/codepen.md
      - Twitter: extensions/twitter.md
      - Instagram: extensions/instagram.md
      - Slideshow: extensions/slideshow.md
      - Image Compare: extensions/image-compare.md
      - Button: extensions/button.md
      - Lightbox: extensions/lightbox.md
      - Mermaid: extensions/mermaid.md
      - Icons: extensions/icons.md
      - Grid: extensions/grid.md
      - Annotate: extensions/annotate.md
  - Integrations:
      - MkDocs: integrations/mkdocs.md
      - Hugo: integrations/hugo.md
  - Demo: demo.md
