[project]
name = "markwright"
version = "0.3.0"
description = "Python-Markdown extensions ported from DigitalOcean's do-markdownit"
readme = "README.md"
authors = [
    { name = "Mason Egger", email = "mason@masonegger.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-Apache-2.0", "NOTICE"]
dependencies = [
    "markdown>=3.4",
    "pydantic>=2.14.1",
    "pymdown-extensions>=11.0.1",
]
keywords = ["markdown", "python-markdown", "do-markdownit", "mkdocs", "hugo"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/MasonEgger/markwright"
Repository = "https://github.com/MasonEgger/markwright"
Documentation = "https://masonegger.github.io/markwright/"

[project.scripts]
mw = "markwright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=7.0",
    "types-markdown>=3.10.2.20260211",
    "mkdocs>=1.6",
    "mkdocs-material>=9.7.5",
    "hypothesis>=6.169.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=markwright --cov-branch --cov-report=term-missing"
markers = [
    "integration: end-to-end tests that require external tools such as Hugo",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "TC"]

[tool.mypy]
strict = true
