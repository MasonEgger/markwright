[project]
name = "markwright"
version = "0.1.0"
description = "Python-Markdown extensions ported from DigitalOcean's do-markdownit"
readme = "README.md"
authors = [
    { name = "Mason Egger", email = "mason@masonegger.com" }
]
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "markdown>=3.4",
    "pymdown-extensions>=10.5",
]
keywords = ["markdown", "python-markdown", "do-markdownit", "mkdocs", "hugo"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/MasonEgger/markwright"
Repository = "https://github.com/MasonEgger/markwright"
Documentation = "https://masonegger.github.io/markwright/"

[project.scripts]
mw = "markwright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=7.0",
    "types-markdown>=3.10.2.20260211",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.5",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that require external tools such as Hugo",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.14"
