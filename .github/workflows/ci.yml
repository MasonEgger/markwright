name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Monthly, so a stable repo keeps proving it still builds against current dependencies
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install just
        uses: extractions/setup-just@v2

      # The integration tests in `just check` drive a real Hugo build; pin it so a Hugo release cannot break CI unseen
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Audit dependencies
        if: matrix.python-version == '3.15'
        run: uv run --with pip-audit pip-audit

      - name: Run the gate
        run: just check

  deploy:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: uv sync
      - run: uv run mkdocs gh-deploy --force
