name: Publish to PyPI

# Builds and publishes markwright to PyPI when a GitHub Release is published.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo.
# The PyPI project's trusted-publisher config must reference this workflow file
# (workflow.yml) and the "pypi" environment below.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install just
        uses: extractions/setup-just@v2

      # The same pinned Hugo as CI, so the release gate runs the Hugo integration tests too
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit

      - name: Run the gate
        run: just check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markwright
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish
